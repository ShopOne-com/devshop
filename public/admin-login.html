<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — DevShop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg:#0a0a0f; --card:#16161f; --border:#232334; --text:#e8e8f0;
    --muted:#8a8aa0; --accent:#6366f1; --accent2:#8b5cf6; --red:#ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
  body {
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:radial-gradient(circle at 50% 0%, rgba(99,102,241,0.15), transparent 60%);
  }
  .login-card {
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:44px; max-width:420px; width:100%;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
    animation:slideUp .5s;
  }
  @keyframes slideUp { from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .logo { font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .logo span { width:28px; height:28px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:8px; }
  h1 { font-size:24px; font-weight:700; margin-bottom:6px; margin-top:20px; }
  p.sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:8px; color:#b8b8cc; }
  input {
    width:100%; padding:13px 16px; background:#0d0d15; border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:14px; outline:none;
    margin-bottom:18px; transition:.2s;
  }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
  button {
    width:100%; padding:14px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; border-radius:10px; color:#fff; font-size:15px; font-weight:600;
    cursor:pointer; transition:.2s;
  }
  button:hover { transform:translateY(-1px); box-shadow:0 10px 20px rgba(99,102,241,0.3); }
  button:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .error {
    background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
    color:#fca5a5; padding:12px; border-radius:10px; font-size:13px;
    margin-bottom:16px; display:none;
  }
  .error.show { display:block; }
  .hint {
    margin-top:20px; padding:14px; background:#0d0d15; border-radius:10px;
    font-size:12px; color:var(--muted); line-height:1.6;
  }
  .hint b { color:#a5b4fc; }
  .back { text-align:center; margin-top:20px; font-size:13px; }
  .back a { color:var(--muted); cursor:pointer; }
  .back a:hover { color:var(--text); }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo"><span></span>DevShop</div>
  <h1>Admin Login</h1>
  <p class="sub">Sign in to access the dashboard</p>

  <div class="error" id="error"></div>

  <form onsubmit="login(event)">
    <label>Email</label>
    <input type="email" id="email" value="admin@devblog.com" required>
    <label>Password</label>
    <input type="password" id="password" value="admin123" required>
    <button type="submit" id="loginBtn">Sign In</button>
  </form>

  <div class="hint">
    <b>Demo credentials:</b><br>
    Email: admin@devblog.com<br>
    Password: admin123
  </div>

  <p class="back"><a onclick="goHome()">← Back to website</a></p>
</div>

<script>
const BASE = window.location.origin;
const API = BASE + '/api';

function goHome() { window.location.href = BASE + '/'; }

async function login(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('error');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  err.classList.remove('show');

  try {
    const res = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    localStorage.setItem('adminToken', data.token);
    localStorage.setItem('adminEmail', data.email);
    window.location.href = BASE + '/admin.html';
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
