<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — DevShop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg:#0a0a0f; --bg2:#12121a; --card:#16161f; --border:#232334;
    --text:#e8e8f0; --muted:#8a8aa0; --accent:#6366f1; --accent2:#8b5cf6;
    --green:#10b981; --red:#ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
  body { background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; }

  nav {
    position:sticky; top:0; z-index:100;
    background:rgba(10,10,15,0.85); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border); padding:16px 0;
  }
  .nav-inner {
    max-width:1200px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .logo { font-size:22px; font-weight:800; letter-spacing:-0.5px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .logo span { width:28px; height:28px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:8px; }
  .nav-actions { display:flex; gap:12px; align-items:center; }
  .btn-admin {
    padding:9px 18px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px; font-size:13px; font-weight:600; color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.2s;
  }
  .btn-admin:hover { transform:translateY(-1px); }

  .search-hero {
    padding:60px 24px 40px;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(99,102,241,0.12), transparent 70%);
    border-bottom:1px solid var(--border);
  }
  .search-hero-inner { max-width:900px; margin:0 auto; text-align:center; }
  .search-hero h1 {
    font-size:clamp(28px, 4vw, 42px); font-weight:900; letter-spacing:-1px;
    margin-bottom:10px;
    background:linear-gradient(180deg,#fff 30%,#8a8aa0);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .search-hero p { color:var(--muted); font-size:15px; margin-bottom:28px; }
  .search-big-wrap { position:relative; max-width:700px; margin:0 auto; }
  .search-big-icon {
    position:absolute; left:24px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:20px; pointer-events:none; transition:.2s;
  }
  .search-big-input {
    width:100%; padding:20px 56px 20px 60px; font-size:17px;
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    color:var(--text); outline:none; transition:.2s;
  }
  .search-big-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(99,102,241,0.15); }
  .search-big-wrap:focus-within .search-big-icon { color:var(--accent); }
  .search-clear {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:50%; background:var(--border);
    border:none; color:var(--muted); cursor:pointer; display:none;
    align-items:center; justify-content:center; transition:.2s;
  }
  .search-clear.show { display:flex; }
  .search-clear:hover { color:var(--text); background:var(--accent); }

  .container { max-width:1200px; margin:0 auto; padding:0 24px; }
  .search-layout { display:grid; grid-template-columns:260px 1fr; gap:32px; padding:36px 0 80px; }

  .filters { position:sticky; top:100px; align-self:flex-start; }
  .filter-block {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:22px;
  }
  .filter-block h4 {
    font-size:13px; font-weight:700; text-transform:uppercase;
    letter-spacing:1px; color:var(--muted); margin-bottom:16px;
    display:flex; align-items:center; gap:8px;
  }
  .filter-block h4 i { color:var(--accent); }
  .filter-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    font-size:14px; transition:.2s; margin-bottom:4px; color:var(--muted);
  }
  .filter-item:hover { background:var(--border); color:var(--text); }
  .filter-item.active {
    background:linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
    color:var(--text); font-weight:600; border:1px solid rgba(99,102,241,0.3);
  }
  .filter-item .count {
    font-size:11px; padding:2px 8px; background:rgba(138,138,160,0.15);
    border-radius:100px; color:var(--muted);
  }
  .filter-item.active .count { background:rgba(99,102,241,0.25); color:#a5b4fc; }

  .results-head {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:24px; gap:16px; flex-wrap:wrap;
  }
  .results-head h2 { font-size:20px; font-weight:700; }
  .results-head h2 span { color:var(--accent); }
  .sort-wrap { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .sort-select {
    padding:9px 14px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:13px; outline:none;
    font-family:inherit; cursor:pointer;
  }
  .sort-select:focus { border-color:var(--accent); }

  .results-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; }
  .product-card {
    display:flex; gap:16px; padding:16px;
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    transition:.25s; cursor:pointer; align-items:center;
    height:200px; overflow:hidden;
  }
  .product-card:hover {
    border-color:var(--accent); transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(0,0,0,0.3);
  }
  .card-img {
    width:130px; height:130px; flex-shrink:0; border-radius:12px;
    background:linear-gradient(135deg,#312e81,#4c1d95);
    background-size:cover; background-position:center;
    border:1px solid var(--border);
  }
  .card-content { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  .card-category {
    font-size:10px; font-weight:700; letter-spacing:1px;
    color:#a5b4fc; text-transform:uppercase;
  }
  .card-content h3 {
    font-size:15px; font-weight:700; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-content p {
    color:var(--muted); font-size:12px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-price { font-size:17px; font-weight:800; color:var(--green); }
  .card-price-old { font-size:11px; color:var(--muted); text-decoration:line-through; margin-left:6px; }

  .empty-state {
    grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--muted);
  }
  .empty-state i { font-size:64px; margin-bottom:20px; opacity:0.3; display:block; }
  .empty-state h3 { font-size:22px; margin-bottom:8px; color:var(--text); }
  .skeleton {
    background:linear-gradient(90deg,var(--card) 25%,#1e1e2e 50%,var(--card) 75%);
    background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:16px; height:200px;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  footer { border-top:1px solid var(--border); padding:30px 24px; background:var(--bg2); text-align:center; }
  .footer-bottom { font-size:13px; color:var(--muted); }

  @media (max-width: 900px) {
    .search-layout { grid-template-columns:1fr; gap:24px; }
    .filters { position:static; }
    .results-grid { grid-template-columns:repeat(2,1fr); gap:14px; }
    .product-card { height:180px; padding:14px; gap:14px; }
    .card-img { width:110px; height:110px; }
  }
  @media (max-width: 640px) {
    .nav-inner { padding:0 16px; }
    .logo { font-size:18px; }
    .logo span { width:24px; height:24px; }
    .btn-admin span { display:none; }
    .btn-admin { padding:8px 12px; }
    .search-hero { padding:40px 16px 30px; }
    .search-hero h1 { font-size:26px; }
    .search-big-input { padding:16px 52px 16px 52px; font-size:15px; border-radius:14px; }
    .search-big-icon { left:18px; font-size:17px; }
    .container { padding:0 16px; }
    .search-layout { padding:24px 0 60px; }
    .results-grid { grid-template-columns:1fr; }
    .results-head { flex-direction:column; align-items:flex-start; }
    .product-card { height:auto; min-height:130px; padding:14px; gap:14px; }
    .product-card:hover { transform:none; }
    .card-img { width:90px; height:90px; }
    .card-content h3 { font-size:14px; }
    .card-content p { font-size:12px; }
    .card-price { font-size:16px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo" onclick="goHome()"><span></span>DevShop</div>
    <div class="nav-actions">
      <button class="btn-admin" onclick="goAdmin()"><i class="fa-solid fa-user-shield"></i> <span>Admin</span></button>
    </div>
  </div>
</nav>

<section class="search-hero">
  <div class="search-hero-inner">
    <h1>Find your next favorite.</h1>
    <p>Search through our curated collection of products.</p>
    <div class="search-big-wrap">
      <i class="fa-solid fa-magnifying-glass search-big-icon"></i>
      <input type="text" id="searchInput" class="search-big-input"
             placeholder="Search by name, category, or keyword..."
             oninput="onSearchInput()" autofocus>
      <button class="search-clear" id="clearBtn" onclick="clearSearch()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>
</section>

<div class="container">
  <div class="search-layout">
    <aside class="filters">
      <div class="filter-block">
        <h4><i class="fa-solid fa-layer-group"></i> Categories</h4>
        <div id="categoryList"></div>
      </div>
    </aside>
    <main>
      <div class="results-head">
        <h2 id="resultsTitle">All Products <span id="resultsCount"></span></h2>
        <div class="sort-wrap">
          <label><i class="fa-solid fa-sort"></i> Sort:</label>
          <select class="sort-select" id="sortSelect" onchange="renderResults()">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="popular">Most Liked</option>
          </select>
        </div>
      </div>
      <div class="results-grid" id="resultsGrid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </main>
  </div>
</div>

<footer>
  <div class="footer-bottom">© 2025 DevShop. All rights reserved.</div>
</footer>

<script>
const BASE = window.location.protocol === 'file:' ? 'http://localhost:5000' : window.location.origin;
const API = BASE + '/api';

let allProducts = [];
let filteredProducts = [];
let activeCategory = 'all';
let searchQuery = '';

function goHome() { window.location.href = BASE + '/'; }
function goAdmin() { window.location.href = BASE + '/admin.html'; }

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatPrice(n) {
  if (!n || n <= 0) return 'Contact for price';
  return '₹' + Number(n).toLocaleString('en-IN');
}
function getExcerpt(text, len=70) {
  return text.length > len ? text.substring(0, len) + '...' : text;
}

function onSearchInput() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('clearBtn').classList.toggle('show', searchQuery.length > 0);
  applyFilters();
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('clearBtn').classList.remove('show');
  applyFilters();
  document.getElementById('searchInput').focus();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});

async function loadData() {
  try {
    const res = await fetch(`${API}/posts`);
    allProducts = await res.json();
    buildCategories();
    applyFilters();
  } catch (e) {
    document.getElementById('resultsGrid').innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-plug-circle-xmark"></i>
        <h3>Server Offline</h3>
        <p>Make sure the backend is running at <b>localhost:5000</b></p>
      </div>`;
  }
}

function buildCategories() {
  const counts = {};
  allProducts.forEach(p => {
    const c = p.category || 'General';
    counts[c] = (counts[c] || 0) + 1;
  });
  const box = document.getElementById('categoryList');
  const allItem = `
    <div class="filter-item ${activeCategory === 'all' ? 'active' : ''}"
         onclick="setCategory('all')">
      <span><i class="fa-solid fa-globe"></i> All</span>
      <span class="count">${allProducts.length}</span>
    </div>`;
  const items = Object.entries(counts).map(([cat, count]) => `
    <div class="filter-item ${activeCategory === cat ? 'active' : ''}"
         onclick="setCategory('${esc(cat).replace(/'/g, "\\'")}')">
      <span><i class="fa-solid fa-tag"></i> ${esc(cat)}</span>
      <span class="count">${count}</span>
    </div>`).join('');
  box.innerHTML = allItem + items;
}

function setCategory(cat) {
  activeCategory = cat;
  buildCategories();
  applyFilters();
}

function applyFilters() {
  filteredProducts = allProducts.filter(p => {
    const matchesCat = activeCategory === 'all' || (p.category || 'General') === activeCategory;
    const matchesSearch = !searchQuery ||
      p.title.toLowerCase().includes(searchQuery) ||
      p.body.toLowerCase().includes(searchQuery) ||
      (p.category || '').toLowerCase().includes(searchQuery);
    return matchesCat && matchesSearch;
  });
  renderResults();
}

function sortProducts(list) {
  const sort = document.getElementById('sortSelect').value;
  const copy = [...list];
  if (sort === 'newest') return copy.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (sort === 'oldest') return copy.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
  if (sort === 'price-low') return copy.sort((a,b) => (a.price||0) - (b.price||0));
  if (sort === 'price-high') return copy.sort((a,b) => (b.price||0) - (a.price||0));
  if (sort === 'popular') return copy.sort((a,b) => (b.likes||0) - (a.likes||0));
  return copy;
}

function renderResults() {
  const box = document.getElementById('resultsGrid');
  const list = sortProducts(filteredProducts);

  const title = document.getElementById('resultsTitle');
  const count = document.getElementById('resultsCount');
  if (searchQuery) {
    title.firstChild.textContent = 'Results for "' + searchQuery + '" ';
  } else if (activeCategory !== 'all') {
    title.firstChild.textContent = activeCategory + ' ';
  } else {
    title.firstChild.textContent = 'All Products ';
  }
  count.textContent = `(${list.length})`;

  if (!list.length) {
    box.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-magnifying-glass"></i>
        <h3>No products found</h3>
        <p>Try different keywords or clear filters.</p>
      </div>`;
    return;
  }

  box.innerHTML = list.map(p => `
    <div class="product-card" onclick="openProduct('${p._id}')">
      <div class="card-img" style="${p.featuredImage?`background-image:url('${esc(p.featuredImage)}')`:''}"></div>
      <div class="card-content">
        <div class="card-category">${esc(p.category || 'General')}</div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(getExcerpt(p.body, 80))}</p>
        <div>
          ${p.price ? `<span class="card-price">${formatPrice(p.price)}</span>` : ''}
          ${p.originalPrice > p.price ? `<span class="card-price-old">${formatPrice(p.originalPrice)}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function openProduct(id) {
  window.location.href = BASE + '/?product=' + id;
}

loadData();
</script>
</body>
</html>
